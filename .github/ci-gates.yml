# What a PR must satisfy to merge, read by the one required check
# (`ci-summary`), which collects the section every reporting job wrote (its
# artifact, else the shared PR comment) and passes only if each gate below is
# satisfied; an opt-in suite is enforced by declaring it here, not by editing
# branch protection.
#
# `require`:
#   always              — must report, and must pass
#   when_labelled: <l>  — only in play when the PR carries that label
#   never               — reports, never gates (advisory)
#
# `advisory: true` keeps a gate visible in the table but never blocks, and
# `block_while_pending: false` lets a PR merge before the gate has answered.
# The order here is the render order of the comment's sections.

gates:
  - id: flake-full
    name: flake focus full (k3d, targeted ×5)
    require: when_labelled
    label: e2e-full-flake-check
    # A reproduction is information, not a veto, but the answer must arrive before
    # merge.
    advisory: true
    block_while_pending: true

  - id: e2e-full
    name: e2e full (k3d)
    require: when_labelled
    label: e2e-full
    # Advisory: the suite's night-to-night swing is larger than most regressions, so
    # a human reads the attributable part in the comment.
    advisory: true
    block_while_pending: false

  - id: flake-fast
    name: flake focus (targeted ×20)
    require: when_labelled
    label: flake-check
    # Same reasoning as flake-full: the answer must arrive, the answer does not veto.
    advisory: true
    block_while_pending: true

  - id: e2e-fast
    name: e2e fast (Playwright, fake stack)
    require: always

  - id: nixos
    name: nixosTest dev-env-*
    require: always

  - id: fast
    name: fast checks (flake + typecheck + unit + python)
    require: always

  - id: images
    name: image builds (every published image)
    require: always

  - id: migrations
    name: db migrations (no contribs, all contribs)
    require: always

  - id: size
    name: image size benchmark
    require: always
    # Advisory: image-sizes-diff.sh never exits non-zero, and a closure that
    # balloons should be seen before merge without vetoing it.
    advisory: true

  - id: bench
    name: benchmarks (PR vs merge base)
    require: when_labelled
    label: bench
    # Advisory: runner timings inform the reviewer, never veto.
    advisory: true
    block_while_pending: false

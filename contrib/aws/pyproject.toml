[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-contrib-aws"
version = "0.0.0"
license = "MIT"
description = "Dynamic, approval-gated AWS access for Scooter's broker — STS credentials per conversation"
requires-python = ">=3.11"
# Depends on the extension surface, never on the broker app.
dependencies = [
  "fastapi",
  "httpx",        # the agent-host notify
  "boto3",        # IAM/STS provisioning
  "sqlalchemy",   # the permission-request store's row model
]

# One extra per service.
[project.optional-dependencies]
broker = ["scooter-broker-lib", "scooter-lib"]

[project.entry-points."agent_broker.providers"]
aws = "scooter_contrib_aws.broker_provider:aws"

# Sandbox-side tools, shipped in the sandbox image (see sandbox.nix) rather than the broker pod.
[project.scripts]
scooter-aws-credentials = "scooter_contrib_aws.cli:_credentials_entry"
scooter-aws = "scooter_contrib_aws.cli:_cli_entry"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-contrib-google"
version = "0.0.0"
license = "MIT"
description = "Google Workspace integration for Scooter's broker — proxies /google/<host>/* with a service-account token injected"
requires-python = ">=3.11"
# Depends on the extension surface, never on the broker app.
dependencies = [
  "fastapi",
  "httpx",
  "pyjwt[crypto]", # the RS256 service-account assertion
]

# One extra per service.
[project.optional-dependencies]
broker = ["scooter-broker-lib", "scooter-lib"]

[project.entry-points."agent_broker.providers"]
google = "scooter_contrib_google.broker_provider:google"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

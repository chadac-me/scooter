[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-contrib-echo"
version = "0.0.0"
license = "MIT"
description = "Example Scooter contrib module — plugs an echo provider into the broker and an echo handler into the webhooks service, via entry points"
requires-python = ">=3.11"
# Depends on the extension surface, never on the broker or webhooks apps, which depend on their contribs.
dependencies = [
  "fastapi",
]

# One extra per service, so a both-services contrib does not put scooter_webhooks_lib on the broker's path.
[project.optional-dependencies]
broker = ["scooter-broker-lib"]
webhooks = ["scooter-webhooks-lib"]

# The two extension seams a contrib can plug into; each service imports only its own group's module.
[project.entry-points."agent_broker.providers"]
echo = "scooter_contrib_echo.broker_provider:echo_contrib"

[project.entry-points."scooter_webhooks.handlers"]
echo = "scooter_contrib_echo.webhooks_handler:echo_contrib"

# hatchling auto-detects the `scooter_contrib_echo` package.

[tool.pytest.ini_options]
asyncio_mode = "auto"

<!doctype html>
<!--
  "marimo + chat": the conversation on the left, this sandbox's marimo on the right.
  Both panes are plain iframes of ingress URLs; this page proxies nothing. The chat and app
  URL placeholders are filled in at service start (sandbox.nix), because on the conversation's
  own origin the path carries no conversation id.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>marimo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B5%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark; --rail: 28px; --line: #d4d4d8; --muted: #71717a; --bg: #fafafa; }
  @media (prefers-color-scheme: dark) { :root { --line: #3f3f46; --muted: #a1a1aa; --bg: #18181b; } }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 12px system-ui, sans-serif; background: var(--bg); }
  #layout { display: flex; height: 100%; }
  #chat { flex: none; width: var(--chat-width, 420px); min-width: 0; }
  #layout.collapsed #chat { width: 0; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: Canvas; }
  #rail {
    flex: none; width: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding-top: 8px; border-inline: 1px solid var(--line); cursor: col-resize; user-select: none;
  }
  #layout.collapsed #rail { cursor: default; }
  #rail button, #rail a {
    all: unset; cursor: pointer; width: 22px; height: 22px; display: grid; place-items: center;
    border-radius: 4px; color: var(--muted); font-size: 13px;
  }
  #rail button:hover, #rail a:hover { background: color-mix(in srgb, var(--muted) 18%, transparent); color: CanvasText; }
  #notebook { flex: 1; min-width: 0; }
  /* While dragging, the iframes would swallow the pointer. */
  #layout.dragging iframe { pointer-events: none; }
  #missing { padding: 16px; color: var(--muted); }
</style>
</head>
<body>
<div id="layout">
  <div id="chat"></div>
  <div id="rail" title="Drag to resize the chat">
    <button id="toggle" type="button" aria-label="Hide chat" title="Hide chat">‹</button>
    <a id="app" href="@APP_URL@" target="_blank" rel="noopener" aria-label="Open in Scooter" title="Open in Scooter">🛴</a>
    <a id="full" href="../marimo/" target="_top" aria-label="marimo full screen" title="marimo full screen">⤢</a>
  </div>
  <div id="notebook"><iframe id="marimo" title="marimo" allow="clipboard-read; clipboard-write; fullscreen"></iframe></div>
</div>
<script>
  "use strict";
  const CHAT_URL = "@CHAT_URL@";
  const layout = document.getElementById("layout");
  const chat = document.getElementById("chat");
  const rail = document.getElementById("rail");
  const toggle = document.getElementById("toggle");
  const KEY_W = "scooter.notebook.chatWidth", KEY_C = "scooter.notebook.chatCollapsed";

  if (CHAT_URL && !CHAT_URL.startsWith("@")) {
    const f = document.createElement("iframe");
    f.title = "Scooter chat";
    f.src = CHAT_URL;
    f.allow = "clipboard-read; clipboard-write";
    chat.append(f);
  } else {
    chat.innerHTML = '<p id="missing">No chat URL: this sandbox has no CONVERSATION_URL.</p>';
  }

  const clamp = (w) => Math.max(260, Math.min(w, window.innerWidth - 320));
  const setWidth = (w) => layout.style.setProperty("--chat-width", clamp(w) + "px");
  const setCollapsed = (c) => {
    layout.classList.toggle("collapsed", c);
    toggle.textContent = c ? "›" : "‹";
    toggle.title = toggle.ariaLabel = c ? "Show chat" : "Hide chat";
    localStorage.setItem(KEY_C, c ? "1" : "0");
  };
  setWidth(Number(localStorage.getItem(KEY_W)) || 420);
  setCollapsed(localStorage.getItem(KEY_C) === "1");

  toggle.addEventListener("click", () => setCollapsed(!layout.classList.contains("collapsed")));
  rail.addEventListener("pointerdown", (e) => {
    if (e.target !== rail || layout.classList.contains("collapsed")) return;
    rail.setPointerCapture(e.pointerId);
    layout.classList.add("dragging");
  });
  rail.addEventListener("pointermove", (e) => {
    if (layout.classList.contains("dragging")) setWidth(e.clientX - chat.getBoundingClientRect().left);
  });
  const endDrag = () => {
    if (!layout.classList.contains("dragging")) return;
    layout.classList.remove("dragging");
    localStorage.setItem(KEY_W, String(parseInt(getComputedStyle(chat).width, 10)));
  };
  rail.addEventListener("pointerup", endDrag);
  rail.addEventListener("pointercancel", endDrag);

  // The page is "just marimo" with a chat beside it: marimo's URL (its routes are a query,
  // e.g. ?file=x.py) is mirrored in the address bar both ways, and its title and icon are
  // ours. marimo is same-origin, so the frame is read directly.
  const MARIMO = new URL("../marimo/", location.href);
  const frame = document.getElementById("marimo");
  const full = document.getElementById("full");
  const icon = document.querySelector("link[rel~=icon]");
  frame.src = MARIMO.pathname + location.search + location.hash;

  const sync = () => {
    let loc;
    try { loc = frame.contentWindow.location; } catch { return; } // not marimo any more
    if (loc.origin !== MARIMO.origin || loc.pathname !== MARIMO.pathname) return;
    full.href = loc.href;
    const next = location.pathname + loc.search + loc.hash;
    // replaceState only: the frame's own pushes already make the Back entries.
    if (next !== location.pathname + location.search + location.hash) history.replaceState(null, "", next);
  };
  const syncHead = () => {
    try {
      const doc = frame.contentDocument;
      document.title = doc.title || "marimo";
      const theirs = doc.querySelector("link[rel~=icon]");
      if (theirs && theirs.href) icon.href = theirs.href;
    } catch { /* cross-origin */ }
  };
  frame.addEventListener("load", () => {
    try {
      const w = frame.contentWindow;
      for (const m of ["pushState", "replaceState"]) {
        const orig = w.history[m].bind(w.history);
        w.history[m] = (...args) => { const r = orig(...args); sync(); return r; };
      }
      w.addEventListener("popstate", sync);
      // marimo opens notebooks in other tabs (a named target per file). Open them as this page
      // instead, so every notebook keeps its chat; in-frame navigation is left alone.
      const asPage = (href) => {
        const u = new URL(href, w.location.href);
        return u.origin === MARIMO.origin && u.pathname === MARIMO.pathname ? location.pathname + u.search + u.hash : null;
      };
      const origOpen = w.open.bind(w);
      w.open = (url, target, features) => {
        const page = url ? asPage(String(url)) : null;
        return page ? window.open(page, target || "_blank", features) : origOpen(url, target, features);
      };
      const onLink = (e) => {
        const a = e.target.closest && e.target.closest("a[href]");
        const page = a && asPage(a.href);
        if (!page) return;
        const newTab = e.type === "auxclick" || e.metaKey || e.ctrlKey || e.shiftKey;
        const target = newTab ? "_blank" : (a.target || "_self").toLowerCase();
        if (target === "_self") return;
        e.preventDefault();
        if (target === "_top" || target === "_parent") location.href = page;
        else window.open(page, target);
      };
      w.document.addEventListener("click", onLink, true);
      w.document.addEventListener("auxclick", (e) => { if (e.button === 1) onLink(e); }, true);
      w.addEventListener("hashchange", sync);
      new MutationObserver(syncHead).observe(w.document.head, { subtree: true, childList: true, characterData: true, attributes: true });
    } catch { /* cross-origin: nothing to follow */ }
    sync();
    syncHead();
  });
</script>
</body>
</html>

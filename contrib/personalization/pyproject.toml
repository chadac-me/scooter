[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-contrib-personalization"
version = "0.0.0"
license = "MIT"
description = "Per-user profile of notes distilled from a user's conversations, read by agents and edited on a settings tab"
requires-python = ">=3.11"
# The extension surface only, never the broker app.
dependencies = [
  "fastapi",
  "httpx",        # conversation history through the agent-host
  "sqlalchemy",   # the profile and note row models
]

[project.optional-dependencies]
broker = ["scooter-broker-lib", "scooter-lib"]

[project.entry-points."agent_broker.providers"]
personalization = "scooter_contrib_personalization.broker_provider:personalization"

[tool.hatch.build.targets.wheel]
packages = ["scooter_contrib_personalization"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "aiosqlite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

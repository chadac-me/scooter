[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-contrib-slack"
version = "0.0.0"
license = "MIT"
description = "Slack integration for Scooter — broker provider (bot-token proxy) and webhooks handler"
requires-python = ">=3.11"
# Depends on the extension surfaces, never on the broker or webhooks apps.
dependencies = [
  "fastapi",
  "httpx",
]

# One extra per service, so `pip install` obeys the same split the Nix build does.
[project.optional-dependencies]
broker = ["scooter-broker-lib", "scooter-lib"]
webhooks = ["scooter-webhooks-lib", "scooter-lib"]

[project.entry-points."agent_broker.providers"]
slack = "scooter_contrib_slack.broker_provider:slack"

[project.entry-points."scooter_webhooks.handlers"]
slack = "scooter_contrib_slack.webhooks_handler:slack"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

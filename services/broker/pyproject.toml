[project]
name = "kubenix-agent-manager-broker"
version = "0.0.0"
license = "MIT"
description = "Extensible credential broker for kubenix-agent-manager sandboxes"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "pydantic",
  "pydantic-settings",
  "kubernetes",   # TokenReview
  "sqlalchemy",   # the registry and shares stores
  "asyncpg",      # Postgres driver
  "aiosqlite",    # SQLite driver for local dev
  "openfga-sdk",  # OpenFGA authorization
  "pyjwt",        # conversation-token verification (core/conv_token.py)
  "fastmcp",      # the agent-facing /mcp endpoint (broker/mcp/routes.py)
  "h11",          # HTTP/1.1 inside the forge proxy tunnel (broker/forge/proxy.py)
  "cryptography", # the forge proxy CA and leaf certificates (broker/forge/ca.py)
  "scooter-schema", # generated SQLAlchemy models for the broker DB (lib/py/scooter-schema)
  "scooter-lib",    # shared structured-logging convention (lib/py/scooter-lib)
  "scooter-broker-lib", # the provider extension surface
]

[project.scripts]
agent-broker = "broker.core.app:main"

# External packages can contribute provider modules via this entry-point group.
[project.entry-points."agent_broker.providers"]
# example = "my_pkg.providers:my_provider"

[tool.setuptools.packages.find]
include = ["broker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/ on sys.path so `from conftest import ...` resolves in every layout.
pythonpath = ["tests"]

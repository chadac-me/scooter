[project]
name = "kubenix-agent-manager-webhooks"
version = "0.0.0"
license = "MIT"
description = "Spawn agent conversations from GitHub/GitLab/Jira/Slack threads"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "websockets",  # WS server and client
  "httpx",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "aiosqlite",   # SQLite driver for local dev
  "asyncpg",     # Postgres driver
  "scooter-schema", # generated SQLAlchemy models for the webhooks database
  "scooter-lib",    # shared structured-logging convention (lib/py/scooter-lib)
  "scooter-webhooks-lib", # the handler extension surface
]

[project.scripts]
agent-webhooks = "webhooks.app:main"

# External packages contribute handler modules via this entry-point group, scanned at startup.
[project.entry-points."scooter_webhooks.handlers"]
# example = "my_pkg.handlers:my_handler"

[tool.setuptools.packages.find]
include = ["webhooks*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

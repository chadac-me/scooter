[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-lib"
version = "0.0.0"
license = "MIT"
description = "Shared library for Scooter's Python services (logging, common config/auth primitives) — service-agnostic, imported by broker/webhooks/scheduler and by contribs"
requires-python = ">=3.11"
dependencies = [
  "pydantic",
  "pydantic-settings",
]

# hatchling auto-detects the `scooter_lib` package.

[dependency-groups]
# httpx is test-only, for the transport exceptions format_error guards against.
dev = ["pytest", "httpx"]

# No asyncio_mode, since nothing here is async and pytest-asyncio is not installed.
